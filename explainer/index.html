      @font-face { font-family: "CMU Serif"; src: url(assets/fonts/cmunti.woff) format("woff"); font-style: italic; font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      .fc-dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: radial-gradient(circle, rgba(225,236,255,0.9) 0%, rgba(120,170,255,0.55) 38%, rgba(56,132,255,0) 70%); }
      .fc-halo { position: absolute; left: 0; top: 0; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(120,170,255,0.55) 0%, rgba(56,132,255,0.22) 35%, rgba(56,132,255,0) 70%); }
      .fc-core { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 18px 6px rgba(156,194,255,0.95), 0 0 46px 18px rgba(56,132,255,0.55); }
    </style>
    <script>
      window.FlittyComet = (function () {
        const TAIL = 96, LAG = 0.005;
        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        const bez = (p, u) => {
          const v = 1 - u;
          return [v * v * v * p[0][0] + 3 * v * v * u * p[1][0] + 3 * v * u * u * p[2][0] + u * u * u * p[3][0],
                  v * v * v * p[0][1] + 3 * v * v * u * p[1][1] + 3 * v * u * u * p[2][1] + u * u * u * p[3][1]];
        };
        // flights: [{ t0, t1, path: [[x,y] x4] }] in time order; between flights it rests at the last end.
        function at(flights, t) {
          if (t <= flights[0].t0) return bez(flights[0].path, 0);
          for (let i = 0; i < flights.length; i++) {
            const f = flights[i];
            if (t <= f.t1) return t < f.t0 ? bez(flights[i - 1].path, 1) : bez(f.path, ease((t - f.t0) / (f.t1 - f.t0)));
          }
          return bez(flights[flights.length - 1].path, 1);
        }
        function create(parent, scale) {
          const s = scale || 1;
          const wrap = document.createElement("div");
          wrap.className = "fc";
          const dots = [];
          for (let i = 0; i < TAIL; i++) {
            const d = document.createElement("div");
            d.className = "fc-dot";
            const size = (64 - (i / TAIL) * 56) * s;
            d.style.width = d.style.height = size + "px";
            d.style.marginLeft = d.style.marginTop = -size / 2 + "px";
            wrap.appendChild(d);
            dots.push(d);
          }
          const halo = document.createElement("div");
          halo.className = "fc-halo";
          halo.style.marginLeft = halo.style.marginTop = -110 + "px";
          const core = document.createElement("div");
          core.className = "fc-core";
          core.style.marginLeft = core.style.marginTop = -15 + "px";
          wrap.appendChild(halo);
          wrap.appendChild(core);
          parent.appendChild(wrap);
          return {
            el: wrap,
            draw(flights, t, glow) {
              const g = glow === undefined ? 1 : glow;
              const [x, y] = at(flights, t);
              core.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
              halo.style.transform = `translate(${x}px, ${y}px) scale(${s * (0.7 + 0.3 * g)})`;
              core.style.opacity = halo.style.opacity = g;
              for (let i = 0; i < TAIL; i++) {
                const [tx, ty] = at(flights, t - (i + 1) * LAG);
                const moved = Math.hypot(tx - x, ty - y);
                dots[i].style.transform = `translate(${tx}px, ${ty}px)`;
                // The tail only shows while the comet is travelling.
                dots[i].style.opacity = Math.min(1, moved / 60) * Math.pow(1 - i / TAIL, 1.4) * 0.38 * g;
              }
            },
          };
        }
        return { create, at, ease };
      })();
    </script>

    <script>
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const clock = (start, duration, draw) => {
        const state = { t: start };
        tl.fromTo(state, { t: start }, { t: start + duration, duration, ease: "none", immediateRender: start === 0, onUpdate: () => draw(state.t) }, start);
      };
      // Manim-style verbs: draw a stroke, write text (outline then fill), fade.
      const draw = (sel, t, d, stagger) => tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.6, ease: "power1.inOut", stagger: stagger || 0, immediateRender: false }, t);
      const write = (sel, t, d, stagger) => {
        d = d || 0.8;
        tl.fromTo(sel, { strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: d * 0.8, ease: "power1.in", stagger: stagger || 0, immediateRender: false }, t);
        tl.fromTo(sel, { fillOpacity: 0 }, { fillOpacity: 1, duration: d * 0.5, ease: "power1.out", stagger: stagger || 0, immediateRender: false }, t + d * 0.55);
      };
      const show = (sel, t, d, stagger) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.3, stagger: stagger || 0, immediateRender: false }, t);
      const hide = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.4, ease: "power1.inOut" }, t);
      const move = (sel, t, d, to) => tl.to(sel, { ...to, duration: d || 0.6, ease: "power2.inOut" }, t);

      // Groups that move scale about the SVG origin; set it once so later tweens never re-anchor.
      gsap.set(["#gQ", "#gS", "#gL"], { svgOrigin: "0 0" });

      // ── A · the question ─────────────────────────────
      write("#tA", 0.9, 2.1);
      tl.to("#gA", { opacity: 0, y: -40, duration: 0.45, ease: "power2.in" }, 3.9);

      // ── B · keys, voice, text ────────────────────────
      draw(".kb", 4.9, 0.55, 0.1);
      write(".kt", 5.1, 0.6, 0.1);
      draw("#wave", 6.2, 0.7);
      // The waveform is redrawn every frame: louder while speaking, flat as it becomes text.
      clock(4.4, 4.6, (t) => {
        const amp = 62 * clamp01((t - 6.2) / 0.6) * (1 - clamp01((t - 7.85) / 0.4));
        let d = "M560 560";
        for (let x = 560; x <= 1360; x += 8) {
          const env = Math.sin(((x - 560) / 800) * Math.PI);
          const y = 560 + amp * env * Math.sin(x * 0.045 + t * 9) * (0.55 + 0.45 * Math.sin(x * 0.013 - t * 3));
          d += ` L${x} ${y.toFixed(1)}`;
        }
        $("wave").setAttribute("d", d);
      });
      tl.fromTo("#qclipr", { attr: { y: 558, height: 0 } }, { attr: { y: 515, height: 80 }, duration: 0.45, ease: "power2.out", immediateRender: false }, 8.15);
      hide("#wave", 8.3, 0.3);
      write("#lQ", 8.5, 0.6);
      hide([".kb", ".kt"], 9.1, 0.4);
      hide("#lQ", 9.3, 0.25);
      move("#gQ", 9.5, 0.6, { x: -180, y: -52.5, scale: 0.5 });

      // ── C · screenshot ───────────────────────────────
      draw("#shot", 10.3, 0.7);
      show("#ui", 11.95, 0.01);
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 11.95);
      write("#lS", 11.9, 0.6);

      // ── D · every button, its name and position ──────
      hide("#lS", 14.1, 0.3);
      draw(".bx", 14.4, 0.35, 0.12);
      show(".bt", 14.55, 0.2, 0.12);
      write(".ll", 15.9, 0.5, 0.18);
      move("#gS", 17.6, 0.6, { x: -180, y: 310, scale: 0.5 });
      move("#gL", 17.6, 0.6, { x: -560, y: 610, scale: 0.5 });

      // ── E · the model ────────────────────────────────
      draw("#ai", 19.0, 0.6);
      draw(".ar", 19.0, 0.6, 0.1);
      show(".ah", 19.6, 0.15, 0.1);
      write("#tAI", 19.6, 0.5);

      // ── F · the answer and its tag ───────────────────
      draw("#outArrow", 21.5, 0.4);
      show("#outHead", 21.9, 0.15);
      write(".ol", 21.7, 0.9, 0.5);
      write("#tag", 24.1, 0.8);
      draw("#tagBox", 25.3, 0.4);

      // ── G · look it up, scale it to the screen ───────
      hide(["#gQ", "#gS", "#gE", "#gO"], 26.9, 0.4);
      move("#gT", 27.1, 0.6, { x: -1180, y: -470 });
      move("#gL", 27.2, 0.7, { x: -1160, y: -70, scale: 1 });
      draw("#hl5", 28.6, 0.45);
      draw("#small", 29.0, 0.5);
      write(".dl", 29.1, 0.6, 1.0);
      show("#dotS", 29.5, 0.2);
      write(".eq", 30.0, 0.8, 0.7);
      draw("#big", 30.1, 0.5);
      draw("#mapLine", 30.7, 0.4);
      show("#dotB", 31.1, 0.2);

      // ── H · the curve ────────────────────────────────
      hide(["#gT", "#gL", "#gG"], 31.8, 0.35);
      draw("#frame", 32.2, 0.6);
      show(".pt", 32.6, 0.25, 0.08);
      draw("#ctrl", 32.6, 0.5);
      write("#bez", 33.0, 1.4);
      show("#tcount", 33.0, 0.2);
      write("#curveNote", 34.9, 0.8);
      hide(["#ctrl", "#curve", ".pt", "#bez", "#tcount", "#curveNote"], 35.9, 0.35);

      // ── I · pixels when there is no name ─────────────
      show("#photo", 36.8, 0.6);
      write("#noName", 37.4, 0.8);
      draw(["#crossH", "#crossV"], 38.4, 0.5);
      write("#coord", 40.1, 0.6);
      write("#tag2", 40.4, 0.8);

      // ── J · the end ──────────────────────────────────
      hide(["#gH", "#gI"], 42.2, 0.4);
      show("#logoLine", 42.85, 0.05);
      draw(".lm", 42.9, 0.5, 0.08);
      show("#logoFill", 43.5, 0.4);
      write("#e1", 43.1, 0.8);
      write("#e2", 44.3, 1.4);

      // ── The comet, plus measurements that need the loaded fonts ──
      const comet = FlittyComet.create($("comet"), 0.85);
      const curve = [{ t0: 33.1, t1: 34.7, path: [[360, 700], [606.7, 400], [853.3, 306.7], [1100, 420]] }];
      const photo = [{ t0: 40.7, t1: 41.3, path: [[420, 760], [380, 600], [470, 470], [552, 490]] }];
      let measured = false;
      clock(0, 48.5, (t) => {
        if (!measured && document.fonts.status === "loaded") {
          measured = true;
          const tag = $("tag"), row = document.querySelectorAll(".ll")[4];
          const x0 = 1320 + tag.getSubStringLength(0, 7), w = tag.getSubStringLength(7, 2);
          $("tagBox").setAttribute("x", x0 - 8);
          $("tagBox").setAttribute("width", w + 16);
          $("hl5").setAttribute("width", row.getComputedTextLength() + 28);
        }
        if (t >= 32.9 && t < 36.2) {
          const u = clamp01((t - 33.1) / 1.6), e = FlittyComet.ease(u);
          comet.draw(curve, t, clamp01((t - 32.9) / 0.2) * (1 - clamp01((t - 35.9) / 0.3)));
          $("curve").style.strokeDashoffset = 1 - e;
          $("tcount").textContent = "t = " + e.toFixed(2);
        } else if (t >= 40.4 && t < 42.6) {
          comet.draw(photo, t, clamp01((t - 40.45) / 0.2) * (1 - clamp01((t - 42.2) / 0.3)));
        } else {
          comet.draw(curve, 0, 0);
        }
      });

      window.__timelines["main"] = tl;
    </script>
