<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flitty marketing video — storyboard v1</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url(assets/fonts/InstrumentSerif-normal.woff2) format("woff2"); font-style: normal; }
  @font-face { font-family: "Instrument Serif"; src: url(assets/fonts/InstrumentSerif-italic.woff2) format("woff2"); font-style: italic; }
  @font-face { font-family: "Geist"; src: url(assets/fonts/Geist-normal.woff2) format("woff2"); font-weight: 100 900; }
  :root { --ink: #141210; --dusk: #1d2240; --cream: #f8f4ec; --card: #fffdf9; --line: #e4ddd0; --muted: #6f6a62; --marker: #ffe066; --blue: #3884ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ece6da; color: var(--ink); font: 15px/1.5 Geist, system-ui, sans-serif; padding: 40px; }
  header { display: flex; align-items: end; gap: 20px; margin-bottom: 28px; }
  header h1 { font: 400 44px/1 "Instrument Serif", serif; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  .tag { margin-left: auto; font-size: 13px; background: var(--ink); color: var(--cream); padding: 5px 12px; border-radius: 999px; }
  .act { grid-column: 1 / -1; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid #d6cdbc; padding-bottom: 6px; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  figure { margin: 0; }
  .cell { aspect-ratio: 16 / 9; container-type: inline-size; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .dark { background: radial-gradient(120% 90% at 50% 0%, var(--dusk), var(--ink) 70%); color: #f3efe7; }
  .light { background: var(--cream); }
  .serif { font-family: "Instrument Serif", serif; font-weight: 400; }
  .mk { background: linear-gradient(176deg, transparent 38%, var(--marker) 39%, var(--marker) 88%, transparent 89%); padding: 0 0.08em; }
  figcaption { padding: 10px 2px 0; font-size: 13px; }
  .row { display: flex; justify-content: space-between; font-weight: 600; }
  .row span:last-child { color: var(--muted); font-weight: 400; }
  .note { color: #3d3933; margin: 4px 0 6px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #cfc5b3; color: var(--muted); }
  /* comet: white core, blue halo, tapered fading tail (drawn static here) */
  .comet-core { position: absolute; width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: #fff; box-shadow: 0 0 1.2cqw 0.5cqw #9cc2ff, 0 0 4cqw 1.6cqw rgba(56,132,255,0.55); transform: translate(-50%, -50%); }
  svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; }
  .win { position: absolute; background: var(--card); border: 0.15cqw solid var(--line); border-radius: 1cqw; box-shadow: 0 1.5cqw 4cqw rgba(20,18,16,0.12); overflow: hidden; }
  .win .bar { height: 3cqw; background: #f1ece2; display: flex; align-items: center; gap: 0.6cqw; padding: 0 1.2cqw; font-size: 1.4cqw; color: var(--muted); }
  .win .bar i { width: 0.9cqw; height: 0.9cqw; border-radius: 50%; background: #d5ccbb; }
  .pill { height: 1.2cqw; border-radius: 1cqw; background: #ece5d8; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 0.8cqw; padding: 1.4cqw; }
  .btnrow b { width: 5.2cqw; height: 4.4cqw; border-radius: 0.6cqw; background: #efe8db; border: 0.12cqw solid #e2d9c8; }
  .key { position: absolute; display: grid; place-items: center; background: var(--card); border: 0.2cqw solid #d8cfbf; border-bottom-width: 1cqw; border-radius: 1.6cqw; font: 600 3.4cqw Geist, sans-serif; box-shadow: 0 1.5cqw 3cqw rgba(0,0,0,0.12); }
  .caption { position: absolute; background: rgba(20,18,16,0.92); color: #fff; border-radius: 1.4cqw; padding: 1.2cqw 1.6cqw; font-size: 1.9cqw; line-height: 1.35; width: 30cqw; box-shadow: 0 1.5cqw 4cqw rgba(0,0,0,0.25); }
  .caption small { display: block; font-size: 1.3cqw; color: rgba(255,255,255,0.6); margin-bottom: 0.3cqw; }
  .label { position: absolute; background: var(--blue); color: white; font: 600 1.4cqw Geist; padding: 0.4cqw 1cqw; border-radius: 0.8cqw; }
  .ptr { position: absolute; width: 2cqw; height: 2.4cqw; background: var(--blue); clip-path: polygon(50% 0, 100% 100%, 50% 77%, 0 100%); transform: rotate(-35deg); filter: drop-shadow(0 0 0.6cqw rgba(56,132,255,0.8)); }
  .side { position: absolute; left: 0; top: 3cqw; bottom: 0; width: 26%; border-right: 0.12cqw solid var(--line); padding: 1.6cqw; display: grid; gap: 1cqw; align-content: start; font-size: 1.6cqw; color: #3d3933; }
  .side .on { background: #ede6d9; border-radius: 0.6cqw; padding: 0.4cqw 0.8cqw; margin: -0.4cqw -0.8cqw; }
  .tokens { background: var(--card); padding: 3cqw; font-size: 1.4cqw; container-type: inline-size; aspect-ratio: 16 / 9; border-radius: 10px; }
  .sw { display: inline-block; width: 4cqw; height: 4cqw; border-radius: 1cqw; margin-right: 0.8cqw; vertical-align: middle; border: 0.15cqw solid #0001; }
</style>
</head>
<body>
<header>
  <h1>Flitty — marketing video <span style="color:var(--muted)">v1</span></h1>
  <p>Feature tour for the website hero. The comet-orb cursor leads every beat.</p>
  <span class="tag">1920×1080 · ~33s · 9 beats · music bed, no voiceover</span>
</header>

<div class="grid">
  <div class="act">Act 1 · Meet the firefly</div>

  <figure id="frame-01">
    <div class="cell dark">
      <svg class="trail" viewBox="0 0 160 90"><defs><linearGradient id="t1" x1="0" x2="1"><stop offset="0" stop-color="#9cc2ff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/></linearGradient></defs>
        <path d="M10 78 C 30 30, 60 18, 74 30" stroke="url(#t1)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <img src="assets/logo-white.svg" style="position:absolute;left:36%;top:30%;width:14cqw" alt="" />
      <div class="serif" style="position:absolute;left:52%;top:30%;font-size:12cqw;line-height:1">flitty</div>
      <div class="comet-core" style="left:47%;top:34%"></div>
    </div>
    <figcaption><div class="row"><span>01 · THE FIREFLY</span><span>0.0–3.5s</span></div>
      <p class="note"><b>The comet streaks in first</b>, low left to centre; its trail condenses into the dotted logo mark, then "flitty" writes in to the right.</p><span class="chip">seam → light flash</span></figcaption>
  </figure>

  <figure id="frame-02">
    <div class="cell light">
      <div class="win" style="left:8%;top:12%;width:84%;height:44%"><div class="bar"><i></i><i></i><i></i>&nbsp;Book1 - Excel</div>
        <div class="btnrow"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
      <div class="serif" style="position:absolute;left:8%;bottom:9%;font-size:8.4cqw;line-height:1">Can't find the <span class="mk" style="font-style:italic">button?</span></div>
      <div class="ptr" style="left:62%;top:42%;background:#8a847b;filter:none"></div>
    </div>
    <figcaption><div class="row"><span>02 · LOST IN THE RIBBON</span><span>3.5–7.0s</span></div>
      <p class="note"><b>A grey cursor wanders</b> over a wall of look-alike buttons; the headline rises from below and the marker swipes behind "button?".</p><span class="chip">seam → slide up</span></figcaption>
  </figure>

  <figure id="frame-03">
    <div class="cell light">
      <div class="key" style="left:16%;top:18%;width:17cqw;height:13cqw">Ctrl</div>
      <div class="key" style="left:36%;top:18%;width:17cqw;height:13cqw;transform:translateY(0.8cqw);border-bottom-width:0.4cqw">Alt</div>
      <div class="key" style="left:56%;top:18%;width:28cqw;height:13cqw">Space</div>
      <svg viewBox="0 0 400 40" style="position:absolute;left:25%;top:52%;width:50%"><g fill="#141210"><rect x="0" y="16" width="8" height="8" rx="4"/><rect x="20" y="8" width="8" height="24" rx="4"/><rect x="40" y="2" width="8" height="36" rx="4"/><rect x="60" y="10" width="8" height="20" rx="4"/><rect x="80" y="4" width="8" height="32" rx="4"/><rect x="100" y="12" width="8" height="16" rx="4"/><rect x="120" y="0" width="8" height="40" rx="4"/><rect x="140" y="8" width="8" height="24" rx="4"/><rect x="160" y="14" width="8" height="12" rx="4"/><rect x="180" y="4" width="8" height="32" rx="4"/><rect x="200" y="10" width="8" height="20" rx="4"/><rect x="220" y="2" width="8" height="36" rx="4"/><rect x="240" y="12" width="8" height="16" rx="4"/><rect x="260" y="6" width="8" height="28" rx="4"/><rect x="280" y="14" width="8" height="12" rx="4"/><rect x="300" y="8" width="8" height="24" rx="4"/><rect x="320" y="16" width="8" height="8" rx="4"/></g></svg>
      <div class="serif" style="position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:8cqw;line-height:1">Hold. <span class="mk" style="font-style:italic">Ask out loud.</span></div>
    </div>
    <figcaption><div class="row"><span>03 · HOLD AND ASK</span><span>7.0–10.5s</span></div>
      <p class="note"><b>The keys press down one by one</b> (Ctrl, Alt, Space), each with a little bounce; on Space the waveform swells out of them.</p><span class="chip">seam → crossfade</span></figcaption>
  </figure>

  <div class="act">Act 2 · How it works</div>

  <figure id="frame-04">
    <div class="cell light">
      <div class="win" style="left:6%;top:8%;width:62%;height:84%"><div class="bar"><i></i><i></i><i></i>&nbsp;Settings</div>
        <div class="side"><span>Home</span><span>System</span><span>Bluetooth &amp; devices</span><span>Network &amp; internet</span><span>Personalization</span><span>Apps</span><span>Accounts</span></div>
        <div style="position:absolute;left:31%;top:7cqw;right:4%;display:grid;gap:1.4cqw"><div class="pill" style="width:50%;height:2.2cqw"></div><div class="pill"></div><div class="pill" style="width:80%"></div><div class="pill" style="width:65%"></div></div></div>
      <div class="ptr" style="left:72%;top:40%"></div>
      <div class="caption" style="left:66%;top:47%"><small>you: how do I turn on dark mode?</small>Click Personalization, then Colors.</div>
    </div>
    <figcaption><div class="row"><span>04 · IT ANSWERS, WITH CAPTIONS</span><span>10.5–14.5s</span></div>
      <p class="note"><b>The "you:" line appears first</b>, then the answer types in word by word in Flitty's caption, next to the resting blue pointer.</p><span class="chip">seam → continuous</span></figcaption>
  </figure>

  <figure id="frame-05">
    <div class="cell light">
      <div class="win" style="left:6%;top:8%;width:62%;height:84%"><div class="bar"><i></i><i></i><i></i>&nbsp;Settings</div>
        <div class="side"><span>Home</span><span>System</span><span>Bluetooth &amp; devices</span><span>Network &amp; internet</span><span class="on">Personalization</span><span>Apps</span><span>Accounts</span></div></div>
      <svg class="trail" viewBox="0 0 160 90"><defs><linearGradient id="t5" x1="1" x2="0"><stop offset="0" stop-color="#9cc2ff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient></defs>
        <path d="M118 36 C 100 6, 50 10, 30 50" stroke="url(#t5)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div class="comet-core" style="left:19%;top:56%"></div>
      <div class="label" style="left:21%;top:59%">Personalization</div>
      <div class="serif" style="position:absolute;right:3%;top:28%;width:27%;font-size:4.6cqw;line-height:1.08">It flies to the <span class="mk" style="font-style:italic">exact</span> button.</div>
    </div>
    <figcaption><div class="row"><span>05 · THE FLIGHT</span><span>14.5–19.0s</span></div>
      <p class="note"><b>The pointer ignites into the comet</b>, arcs over the window and lands on "Personalization" with a soft ripple and its label. Hero beat.</p><span class="chip">seam → whip pan</span></figcaption>
  </figure>

  <figure id="frame-06">
    <div class="cell light">
      <div class="win" style="left:-6%;top:22%;width:34%;height:52%"><div class="bar"><i></i><i></i><i></i>&nbsp;Sheet</div><div class="btnrow"><b></b><b></b><b></b><b></b></div></div>
      <div class="win" style="left:33%;top:22%;width:34%;height:52%;background:#1c1c20;border-color:#2c2c32"><div class="bar" style="background:#26262c;color:#9a9aa3"><i></i><i></i><i></i>&nbsp;Code</div></div>
      <div class="win" style="left:72%;top:22%;width:34%;height:52%"><div class="bar"><i></i><i></i><i></i>&nbsp;Video editor</div></div>
      <svg class="trail" viewBox="0 0 160 90"><path d="M24 40 C 40 18, 60 18, 74 38 M 82 38 C 98 18, 118 18, 132 40" stroke="#9cc2ff" stroke-opacity=".6" stroke-width="1" fill="none" stroke-dasharray="1 3" stroke-linecap="round"/></svg>
      <div class="comet-core" style="left:83%;top:44%"></div>
      <div class="serif" style="position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:6.4cqw">Any app. <span class="mk" style="font-style:italic">Even full screen.</span></div>
    </div>
    <figcaption><div class="row"><span>06 · ANY APP, EVEN FULL SCREEN</span><span>19.0–23.0s</span></div>
      <p class="note"><b>The camera pans right</b> across three apps while the comet hops to a button in each; the caption lands with the last hop.</p><span class="chip">seam → crossfade</span></figcaption>
  </figure>

  <div class="act">Act 3 · Proof and trust</div>

  <figure id="frame-07">
    <div class="cell dark">
      <div style="position:absolute;left:12%;top:12%;width:76%;height:70%;background:#000;border-radius:1.4cqw;border:0.6cqw solid #1c1c20;display:grid;place-items:center;color:#777;font-size:2cqw">real-demo.mp4 (Flitty pointing at GitHub's Issues tab)</div>
      <div style="position:absolute;left:12%;bottom:7%;font-size:1.8cqw;color:#c7c2b9">● Real recording · Windows 11</div>
    </div>
    <figcaption><div class="row"><span>07 · REAL, ON WINDOWS</span><span>23.0–26.0s</span></div>
      <p class="note"><b>The real clip pushes in slowly</b> inside a dark frame; the tag fades in bottom-left.</p><span class="chip">seam → cut</span></figcaption>
  </figure>

  <figure id="frame-08">
    <div class="cell dark">
      <div class="serif" style="position:absolute;left:0;right:0;top:34%;text-align:center;font-size:9cqw">Your own <span style="font-style:italic">OpenAI key.</span></div>
      <div style="position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:1.8cqw;color:#a39d93">then · No account. No server. · then · Free and open source.</div>
    </div>
    <figcaption><div class="row"><span>08 · YOURS</span><span>26.0–29.0s</span></div>
      <p class="note"><b>Three near-still cards, hard cuts</b> on the beat, about one second each.</p><span class="chip">seam → crossfade</span></figcaption>
  </figure>

  <figure id="frame-09">
    <div class="cell dark">
      <img src="assets/logo-white.svg" style="position:absolute;left:50%;top:13%;width:8cqw;transform:translateX(-50%)" alt="" />
      <div class="serif" style="position:absolute;left:0;right:0;top:31%;text-align:center;font-size:7cqw;line-height:1.18">Ask out loud.<br />Flitty shows you <span class="mk" style="font-style:italic;color:var(--ink)">exactly where.</span></div>
      <div class="comet-core" style="left:79%;top:63%"></div>
      <div style="position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:2cqw;color:#d9d3c8">Free for Windows · alexriderspy.github.io/heyflitty</div>
    </div>
    <figcaption><div class="row"><span>09 · EXACTLY WHERE</span><span>29.0–33.0s</span></div>
      <p class="note"><b>The line sets first</b>; the comet sweeps left to right under "exactly where." and paints the marker behind it; logo and URL fade in last.</p><span class="chip">end</span></figcaption>
  </figure>

  <div class="act">Reference</div>
  <figure><div class="tokens" style="display:grid;align-content:center;gap:2cqw">
    <b>Seam map</b>
    <div>01 ─flash→ 02 ─slide→ 03 ─fade→ 04 ═continuous═ 05 ─whip→ 06 ─fade→ 07 ─cut→ 08 ─fade→ 09</div>
  </div></figure>
  <figure><div class="tokens">
    <b>Tokens</b><br /><br />
    <span class="sw" style="background:#141210"></span>ink &nbsp;<span class="sw" style="background:#1d2240"></span>dusk &nbsp;<span class="sw" style="background:#f8f4ec"></span>cream &nbsp;<span class="sw" style="background:#ffe066"></span>marker &nbsp;<span class="sw" style="background:#3884ff"></span>comet<br /><br />
    <span class="serif" style="font-size:4cqw">Instrument Serif</span> headlines · <span style="font-family:Geist">Geist</span> UI and labels<br />
    Bans: gradient text, neon, stock photos, claims Flitty can't back (it points, it doesn't click).
  </div></figure>
</div>
</body>
</html>
