[package]
name = "flitty"
version = "0.1.0"
description = "Your AI screen buddy that shows you exactly where to click"
authors = ["Sreemanti Dey"]
license = "MIT"
edition = "2021"

[lib]
name = "flitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cpal = "0.18"
hound = "3.5"
# native-tls uses SChannel on Windows and Security.framework on macOS: no C toolchain beyond the platform SDK.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "stream", "multipart"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
uiautomation = "0.25"

# Image resizing and JPEG encoding are painfully slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
