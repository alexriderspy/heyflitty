name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows 11 x64, Windows 11 ARM64, Windows 10, macOS]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: HeyFlitty version
      placeholder: "0.1.0"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked, what you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: message
    attributes:
      label: Message shown next to the cursor
      description: Copy it here if HeyFlitty showed one.
