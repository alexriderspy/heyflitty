    <script>
      window.FlittyComet = (function () {
        const TAIL = 96, LAG = 0.005;
        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        const bez = (p, u) => {
          const v = 1 - u;
          return [v * v * v * p[0][0] + 3 * v * v * u * p[1][0] + 3 * v * u * u * p[2][0] + u * u * u * p[3][0],
                  v * v * v * p[0][1] + 3 * v * v * u * p[1][1] + 3 * v * u * u * p[2][1] + u * u * u * p[3][1]];
        };
        // flights: [{ t0, t1, path: [[x,y] x4] }] in time order; between flights it rests at the last end.
        function at(flights, t) {
          if (t <= flights[0].t0) return bez(flights[0].path, 0);
          for (let i = 0; i < flights.length; i++) {
            const f = flights[i];
            if (t <= f.t1) return t < f.t0 ? bez(flights[i - 1].path, 1) : bez(f.path, ease((t - f.t0) / (f.t1 - f.t0)));
          }
          return bez(flights[flights.length - 1].path, 1);
        }
        function create(parent, scale) {
          const s = scale || 1;
          const wrap = document.createElement("div");
          wrap.className = "fc";
          const dots = [];
          for (let i = 0; i < TAIL; i++) {
            const d = document.createElement("div");
            d.className = "fc-dot";
            const size = (64 - (i / TAIL) * 56) * s;
            d.style.width = d.style.height = size + "px";
            d.style.marginLeft = d.style.marginTop = -size / 2 + "px";
            wrap.appendChild(d);
            dots.push(d);
          }
          const halo = document.createElement("div");
          halo.className = "fc-halo";
          halo.style.marginLeft = halo.style.marginTop = -110 + "px";
          const core = document.createElement("div");
          core.className = "fc-core";
          core.style.marginLeft = core.style.marginTop = -15 + "px";
          wrap.appendChild(halo);
          wrap.appendChild(core);
          parent.appendChild(wrap);
          return {
            el: wrap,
            draw(flights, t, glow) {
              const g = glow === undefined ? 1 : glow;
              const [x, y] = at(flights, t);
              core.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
              halo.style.transform = `translate(${x}px, ${y}px) scale(${s * (0.7 + 0.3 * g)})`;
              core.style.opacity = halo.style.opacity = g;
              for (let i = 0; i < TAIL; i++) {
                const [tx, ty] = at(flights, t - (i + 1) * LAG);
                const moved = Math.hypot(tx - x, ty - y);
                dots[i].style.transform = `translate(${tx}px, ${ty}px)`;
                // The tail only shows while the comet is travelling.
                dots[i].style.opacity = Math.min(1, moved / 60) * Math.pow(1 - i / TAIL, 1.4) * 0.38 * g;
              }
            },
          };
        }
        return { create, at, ease };
      })();
    </script>

        ${["Budget 2026.xlsx", "Trip photos", "Invoice-0412.pdf", "Setup.exe", "Notes.txt", "Slides.pptx"].map((n, i) => `<div class="row" style="left:22px;top:${18 + i * 52}px;font-size:20px"><i style="width:26px;height:22px;border-radius:5px;background:${["#2fa36b", "#f4b740", "#ef6a5a", "#3d8bfd", "#9aa3b2", "#e7843c"][i]}"></i>${n}</div>`).join("")}</div>`;
      $("s1-w4").innerHTML = `<div class="tb" style="background:#ececee"><span style="display:flex;gap:8px"><i style="width:13px;height:13px;border-radius:50%;background:#ff5f57;display:block"></i><i style="width:13px;height:13px;border-radius:50%;background:#febc2e;display:block"></i><i style="width:13px;height:13px;border-radius:50%;background:#28c840;display:block"></i></span><span style="margin-left:16px">Displays</span></div>
        <div class="content" style="background:linear-gradient(155deg,#f8cf92 0%,#ef9271 38%,#b9578c 68%,#4b3b92 100%)"></div>`;
      $("s5-win").innerHTML = settingsHTML("s5");

      // ── Kinetic type: lines of words, chips and keys, each popping in at its own time ──
      function kinetic(id, rows) {
        const host = $(id);
        rows.forEach((row) => {
          const ln = document.createElement("span");
          ln.className = "ln";
          row.forEach(([html, at, cls]) => {
            const w = document.createElement("span");
            w.className = "w" + (cls ? " " + cls : "");
            w.innerHTML = html;
            w.dataset.at = at;
            ln.appendChild(w);
          });
          host.appendChild(ln);
        });
        return [...host.querySelectorAll(".w")];
      }
      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, ease) =>
        tl.fromTo(el, { opacity: 0, y: 34, scale: 0.92, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: ease || "power3.out", immediateRender: false }, t);
      const popAll = (els) => els.forEach((el) => pop(el, +el.dataset.at, el.classList.contains("spring") ? "back.out(2.2)" : undefined));
      const clock = (start, duration, draw) => {
        const state = { t: start };
        tl.fromTo(state, { t: start }, { t: start + duration, duration, ease: "none", immediateRender: start === 0, onUpdate: () => draw(state.t) }, start);
      };
      // Centre of an element in composition pixels, after every 3D and camera transform.
      function at(el) {
        const r = el.getBoundingClientRect(), R = $("root").getBoundingClientRect(), k = R.width / 1920;
        return [(r.left + r.width / 2 - R.left) / k, (r.top + r.height / 2 - R.top) / k];
      }
      const tip = (p) => [p[0] + 20, p[1] + 20];
      const place = (id, p, dx, dy) => { $(id).style.left = p[0] + dx + "px"; $(id).style.top = p[1] + dy + "px"; };
      const typed = (id, text, t, t0, cps) => { $(id).textContent = text.slice(0, Math.max(0, Math.min(text.length, Math.floor((t - t0) * (cps || 34))))); };
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      function bars(host, n) { for (let i = 0; i < n; i++) host.appendChild(document.createElement("i")); return [...host.children]; }
      const liveBars = (els, t, on, max) => els.forEach((b, i) => (b.style.height = 8 + (on ? max * Math.abs(Math.sin(t * 9 + i * 0.8)) * Math.abs(Math.sin(i * 0.5 + t * 3)) : 0) + "px"));
      // A labelled ring that pulses in on each landing.
      function pin(ringId, p, since) {
        const shown = since > 0;
        $(ringId).style.opacity = shown ? clamp01(since * 5) : 0;
        $(ringId).style.transform = `translate(${p[0]}px, ${p[1]}px) rotate(${since * 70}deg) scale(${shown ? 1.35 - 0.35 * clamp01(since * 3) : 1})`;
      }

      // ── 1 · The orb and the windows ──────────────────
      ["#s1-w1", "#s1-w2", "#s1-w3", "#s1-w4"].forEach((w, i) => {
        tl.fromTo(w, { y: 760, rotationX: 58, rotationY: -18, rotationZ: 5, opacity: 0, transformPerspective: 1700 }, { y: 0, rotationX: 16, rotationY: -10, rotationZ: 0, opacity: 1, duration: 1.15, ease: "power3.out" }, 0.7 + i * 0.14);
        tl.to(w, { y: -24, rotationX: 8, rotationY: -4, duration: 1.5, ease: "none" }, 2.0 + i * 0.05);
      });
      tl.fromTo("#s1-sheen", { x: -1400, opacity: 1 }, { x: 1400, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 2.0);
      const c1 = FlittyComet.create($("s1-comet"), 1.1);
      const f1 = [{ t0: 0.25, t1: 1.5, path: [[-120, 820], [400, 700], [700, 420], [960, 540]] }];
      clock(0, 4.0, (t) => c1.draw(f1, t, t < 3.2 ? 1 : clamp01(1 - (t - 3.2) / 0.4)));
      tl.fromTo("#s1-flood", { scale: 0, opacity: 1 }, { scale: 40, opacity: 1, duration: 0.75, ease: "power2.in" }, 3.15);

      // ── 2 · Meet Flitty ──────────────────────────────
      pop("#s2-meet", wt("l1", 0));
      const scatter = [[-60, 40, -80], [-40, -50, 60], [30, 60, -40], [50, -40, 90], [70, 30, -60], [90, -70, 120]];
      document.querySelectorAll("#s2-mark .pc").forEach((p, i) => {
        const [x, y, r] = scatter[i];
        tl.fromTo(p, { x, y, rotation: r, scale: 0.2, opacity: 0, transformOrigin: "50% 50%" }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)", immediateRender: false }, 4.4 + i * 0.07);
      });
      tl.set("#s2-mark .pc", { opacity: 0 }, 0);
      [..."flitty"].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch;
        s.style.display = "inline-block";
        s.style.opacity = 0;
        $("s2-word").appendChild(s);
        pop(s, 4.8 + i * 0.06);
      });

      // ── 3 · Stuck on a button ────────────────────────
      popAll(kinetic("s3-kt", [
        [["Stuck", wt("l2", 0)], ["on", wt("l2", 1)], ["a", wt("l2", 2)], ['<span class="chipi btn">Export&nbsp;&nbsp;▾</span>', wt("l2", 3), "spring"]],
        [["you", wt("l2", 4)], ["can't", wt("l2", 5), "accent"], ["find?", wt("l2", 6), "accent"]],
      ]));
      tl.fromTo("#s3-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 7.5);
      const hunt = [[1560, 640], [1180, 480], [1450, 410], [1290, 570], [1620, 470], [1380, 520]];
      clock(6.4, 3.0, (t) => {
        const u = Math.max(0, t - 7.5), seg = Math.min(hunt.length - 2, Math.floor(u / 0.34));
        const e = FlittyComet.ease(clamp01((u - seg * 0.34) / 0.34)), a = hunt[seg], b = hunt[seg + 1];
        $("s3-cursor").style.transform = `translate(${a[0] + (b[0] - a[0]) * e}px, ${a[1] + (b[1] - a[1]) * e}px)`;
      });

      // ── 4 · Hold the keys and ask ────────────────────
      const k4 = kinetic("s4-kt", [
        [["Just", wt("l3", 0)], ["hold", wt("l3", 1)], ['<span class="kc">Ctrl</span>', wt("l3", 3), "spring"], ['<span class="kc">Alt</span>', wt("l3", 3) + 0.07, "spring"], ['<span class="kc" style="padding:0 70px">Space</span>', wt("l3", 3) + 0.14, "spring"]],
        [["and", wt("l3", 4)], ["ask.", wt("l3", 5), "accent"]],
      ]);
      popAll(k4);
      tl.to("#s4-kt .kc", { y: 9, boxShadow: "0 1px 0 #2a2a2f", duration: 0.12, stagger: 0.08 }, 11.0);
      const w4 = bars($("s4-wave"), 22);
      w4.forEach((b) => Object.assign(b.style, { width: "8px", borderRadius: "4px", background: "#3884ff", display: "block" }));
      tl.fromTo("#s4-wave", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 11.3);
      clock(9.4, 3.0, (t) => liveBars(w4, t, t > 11.3, 70));

      // ── 5 · Settings: it sees, answers and points ────
      const B = 12.4;
      tl.fromTo("#s5-win", { rotationX: 34, rotationY: -26, y: 340, opacity: 0, transformPerspective: 1700 }, { rotationX: 9, rotationY: -9, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, B);
      tl.fromTo("#s5-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.16, x: -60, y: 40, duration: 1.4, ease: "power2.inOut" }, B + 1.0);
      tl.fromTo("#s5-pill", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, B + 0.35);
      tl.to("#s5-pill", { opacity: 0, y: 30, duration: 0.3 }, B + 2.3);
      tl.fromTo("#s5-scan", { y: 120, opacity: 1 }, { y: 900, opacity: 1, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 15.0);
      tl.to("#s5-scan", { opacity: 0, duration: 0.15 }, 15.9);
      tl.fromTo("#s5-cap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, wt("l4", 4));
      tl.fromTo("#s5-l1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 18.05);
      tl.to("#s5-l1", { opacity: 0, duration: 0.2 }, 18.5);
      tl.fromTo("#s5-l2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 19.1);
      tl.fromTo("#s5-mon2", { borderColor: "#b9c3d6", backgroundColor: "#dfe6f3" }, { borderColor: "#2f6fe0", backgroundColor: "#d3e2fb", duration: 0.25, immediateRender: false }, 18.05);
      const phrase = (id, idx) => {
        $(id).innerHTML = idx.map((i) => `<span class="w">${WORDS.l4[i][0].replace(/[,.]$/, "")}</span>`).join("");
        [...$(id).children].forEach((w, j) => pop(w, wt("l4", idx[j])));
      };
      phrase("s5-p1", [0, 1, 2, 3]);
      phrase("s5-p2", [4, 5, 6]);
      phrase("s5-p3", [8, 9, 10, 11, 12]);
      tl.to("#s5-p1", { opacity: 0, duration: 0.15 }, 16.05);
      tl.to("#s5-p2", { opacity: 0, duration: 0.15 }, 17.4);
      const c5 = FlittyComet.create($("s5-comet"), 0.9);
      const b5 = bars($("s5-pill").querySelector(".bars"), 9);
      const q5 = "how do I make the monitor my main display?";
      const a5 = "Click display 2, then tick Make this my main display.";
      clock(B, 7.2, (t) => {
        typed("s5-q", q5, t, B + 0.6);
        liveBars(b5, t, t > B + 0.35 && t < B + 2.1, 30);
        typed("s5-ans", a5, t, 16.25);
        const D = at($("s5-mon2")), C = at($("s5-main")), start = [1230, 430];
        const flights = [
          { t0: 17.45, t1: 18.05, path: [start, [1100, 260], [D[0] + 200, D[1] - 200], tip(D)] },
          { t0: 18.5, t1: 19.1, path: [tip(D), [D[0] + 40, D[1] + 180], [C[0] + 220, C[1] - 60], tip(C)] },
        ];
        c5.draw(flights, t, clamp01((t - 16.0) / 0.3));
        const target = t < 18.5 ? D : C;
        pin("s5-ring", target, t < 18.05 ? -1 : t < 18.5 ? t - 18.05 : t - 19.1);
        place("s5-l1", D, 44, 40);
        place("s5-l2", C, 330, -24);
      });

      // ── 6 · Or ask about anything you see ────────────
      popAll(kinetic("s6-kt", [
        [["Or", wt("l5", 0)], ["ask", wt("l5", 1)], ["about", wt("l5", 2)]],
        [["anything", wt("l5", 3), "accent"], ["you", wt("l5", 4)], ["see.", wt("l5", 5)]],
      ]));
      tl.set("#s6-kt", { opacity: 0 }, 22.5);
      tl.set("#s6-photo", { opacity: 1 }, 22.5);
      tl.fromTo("#s6-frame", { rotationX: 9, rotationY: -7, scale: 1.14, transformPerspective: 1700 }, { rotationX: 2, rotationY: -2, scale: 1.05, duration: 3.3, ease: "power1.out", immediateRender: false }, 22.5);
      tl.fromTo("#s6-pill", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 22.65);
      tl.to("#s6-pill", { opacity: 0, y: 30, duration: 0.25 }, 23.85);
      tl.fromTo("#s6-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 24.55);
      tl.fromTo("#s6-cap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 24.6);
      const c6 = FlittyComet.create($("s6-comet"), 0.9);
      const b6 = bars($("s6-pill").querySelector(".bars"), 9);
      clock(19.6, 6.2, (t) => {
        const P = at($("s6-port"));
        let m;
        if (t < 22.75) {
          const e = FlittyComet.ease(clamp01((t - 22.5) / 0.25));
          m = [P[0] + 320 - 250 * e, P[1] + 260 - 260 * e];
        } else {
          const th = clamp01((t - 22.75) / 1.15) * Math.PI * 3.3;
          m = [P[0] + 70 * Math.cos(th), P[1] + 46 * Math.sin(th)];
        }
        $("s6-cursor").style.transform = `translate(${m[0]}px, ${m[1]}px)`;
        typed("s6-q", "what's this port?", t, 22.85);
        liveBars(b6, t, t > 22.65 && t < 23.6, 30);
        const end = Math.PI * 3.3, S = [P[0] + 70 * Math.cos(end) + 40, P[1] + 46 * Math.sin(end) + 36];
        c6.draw([{ t0: 23.95, t1: 24.55, path: [S, [S[0] + 120, S[1] - 220], [P[0] + 200, P[1] - 200], tip(P)] }], t, clamp01((t - 23.8) / 0.2));
        pin("s6-ring", P, t - 24.55);
        place("s6-label", P, 40, 44);
        place("s6-cap", P, 110, -250);
        typed("s6-ans", "That's an Ethernet port, for wired internet.", t, 24.65, 42);
      });

      // ── 7 · Windows and Mac ──────────────────────────
      const winIcon = `<span style="display:grid;grid-template-columns:24px 24px;gap:4px"><i style="width:24px;height:24px;background:#2f7cf6;display:block"></i><i style="width:24px;height:24px;background:#2f7cf6;display:block"></i><i style="width:24px;height:24px;background:#2f7cf6;display:block"></i><i style="width:24px;height:24px;background:#2f7cf6;display:block"></i></span>`;
      const macIcon = `<span style="display:flex;gap:9px"><i style="width:22px;height:22px;border-radius:50%;background:#ff5f57;display:block"></i><i style="width:22px;height:22px;border-radius:50%;background:#febc2e;display:block"></i><i style="width:22px;height:22px;border-radius:50%;background:#28c840;display:block"></i></span>`;
      popAll(kinetic("s7-kt", [
        [["It", wt("l6", 0)], ["works", wt("l6", 1)], ["on", wt("l6", 2)], [`<span class="chipi">${winIcon}Windows</span>`, wt("l6", 3), "spring"]],
        [["and", wt("l6", 4)], ["on", wt("l6", 5)], [`<span class="chipi">${macIcon}Mac</span>`, wt("l6", 6), "spring"]],
      ]));

      // ── 8 · Yours ────────────────────────────────────
      const cells = [];
      for (let r = 0; r < 14; r++) for (let c = 0; c < 24; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.left = c * 80 + "px";
        cell.style.top = r * 80 - 20 + "px";
        $("s8-grid").appendChild(cell);
        cells.push([cell, rand() * 0.8, rand() * 6.28]);
      }
      clock(29.2, 4.6, (t) => cells.forEach(([cell, base, phase]) => (cell.style.opacity = clamp01(base - 0.25 + 0.45 * Math.sin(t * 1.6 + phase)))));
      popAll(kinetic("s8-a", [[["Your", wt("l7", 0), "accent"], ["own", wt("l7", 1)], ["key.", wt("l7", 2)]]]));
      popAll(kinetic("s8-b", [[["No", wt("l7", 3)], ["account.", wt("l7", 4)]]]));
      popAll(kinetic("s8-c", [[["No", wt("l7", 5), "accent"], ["server.", wt("l7", 6)]]]));
      tl.set("#s8-a", { opacity: 0 }, wt("l7", 3) - 0.02);
      tl.set("#s8-b", { opacity: 0 }, wt("l7", 5) - 0.02);

      // ── 9 · Lockup ───────────────────────────────────
      tl.fromTo("#s9-mark", { scale: 0.6, rotation: -24, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, 33.85);
      [..."flitty"].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch;
        s.style.display = "inline-block";
        $("s9-word").appendChild(s);
        tl.fromTo(s, { x: (i - 2.5) * 70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 33.85 + i * 0.03);
      });
      tl.set(["#s9-mark", "#s9-word span"], { opacity: 0 }, 0);

      // ── 10 · Get started ─────────────────────────────
      popAll(kinetic("s10-kt", [[["Get", wt("l8", 0)], ["started", wt("l8", 1)], ["free", wt("l8", 2)], ["at", 36.5]]]));
      const url = "alexriderspy.github.io/heyflitty";
      clock(35.5, 3.3, (t) => typed("s10-url", url, t, 36.7, 42));
      tl.fromTo("#s10-url", { color: "#3884ff" }, { color: "#111111", duration: 0.4, immediateRender: false }, 37.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
